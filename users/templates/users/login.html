{% extends 'blog/base.html' %}
{% block title %}Вход на сайт{% endblock %}
{% block content %}
<h1 class="text-center fw-bold card box-shadow"> Вход на сайт </h1>
<div class="container my-5">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card-body">
                    {% csrf_token %}
                    {{form.as_p}}
                </div>
                <div class="col-2"></div>
                <button type="submit" class="btn btn-primary my-4">
                    Войти
                </button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
