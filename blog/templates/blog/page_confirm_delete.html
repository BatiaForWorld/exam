{% extends 'blog/base.html' %}
{% block content %}
<div class="container py-4">
    <div class="card shadow-sm bg-body-tertiary">
        <div class="card-body text-center">
            <h1 class="mb-4">Удаление статьи</h1>
            <p class="fs-5">Вы действительно хотите удалить статью «<strong>{{ object.title }}</strong>»?</p>
            <form method="post" class="d-inline-block mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">Удалить</button>
                <a class="btn btn-secondary" href="{% url 'blog:blog_list' %}">Отменить</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
