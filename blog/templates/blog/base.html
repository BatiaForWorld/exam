<script src="{% static 'js/bootstrap.bundle.js' %}" class="astro-vvvwv3sm"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[type=password]').forEach(function (input) {
            // Если уже есть кнопка, пропустить.
            if (input.nextElementSibling && input.nextElementSibling.classList.contains('password-show-toggle')) {
                return;
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'input-group mb-3';

            const parent = input.parentNode;
            if (parent.classList.contains('input-group')) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn btn-outline-secondary password-show-toggle';
                button.innerText = '👁';
                button.title = 'Показать/скрыть пароль';

                button.addEventListener('click', function () {
                    input.type = input.type === 'password' ? 'text' : 'password';
                });

                parent.appendChild(button);
                return;
            }

            const next = input.nextSibling;
            parent.replaceChild(wrapper, input);
            wrapper.appendChild(input);

            const buttonGroup = document.createElement('button');
            buttonGroup.type = 'button';
            buttonGroup.className = 'btn btn-outline-secondary password-show-toggle';
            buttonGroup.innerText = '👁';
            buttonGroup.title = 'Показать/скрыть пароль';

            buttonGroup.addEventListener('click', function () {
                input.type = input.type === 'password' ? 'text' : 'password';
            });

            wrapper.appendChild(buttonGroup);
            if (next) wrapper.appendChild(next);
        });
    });
</script>
</body>
